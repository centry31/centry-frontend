name: Frontend CI

on:
  pull_request:
  push:
    branches:
      - main
      - develop
      - 'release/**'
      - 'feature/**'

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Lint TypeScript
        run: yarn lint:ts

      - name: Build
        run: yarn build
